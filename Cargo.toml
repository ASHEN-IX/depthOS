[workspace]
members = ["crates/depthos-observer"]
default-members = [".", "crates/depthos-observer"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
rustix = { version = "1", features = ["process"] }

[package]
name = "depthos-core"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "depthos"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.43", features = ["uuid"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tokio.workspace = true
depthos-observer = { path = "crates/depthos-observer" }
zbus.workspace = true
rustix.workspace = true

[dev-dependencies]
futures-lite = "2"
tempfile = "3"

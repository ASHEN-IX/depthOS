<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E8FF"/>
      <stop offset="100%" stop-color="#00A2D6"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="100%" stop-color="#B30059"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB2"/>
      <stop offset="100%" stop-color="#009966"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1F293D" stroke-width="4"/>

  <!-- Spatial Horizon Grid Accents -->
  <path d="M 96 380 L 416 380" stroke="#1E2B45" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 128 410 L 384 410" stroke="#1E2B45" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Tier 3: Desktops (Bottom Spatial Plane) -->
  <g filter="url(#neonGlow)">
    <polygon points="256,400 390,325 256,260 122,325" fill="#0A1826" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Desktop Grid Subdivisions -->
    <line x1="189" y1="292.5" x2="323" y2="362.5" stroke="#00FFB2" stroke-width="1.5" opacity="0.4"/>
    <line x1="323" y1="292.5" x2="189" y2="362.5" stroke="#00FFB2" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Tier 2: Workspaces (Middle Spatial Plane) -->
  <g filter="url(#neonGlow)">
    <polygon points="256,315 376,245 256,185 136,245" fill="#1A0D1E" stroke="url(#magentaGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="256" cy="250" r="6" fill="#FF2E93"/>
  </g>

  <!-- Tier 1: World (Top Spatial Core) -->
  <g filter="url(#neonGlow)">
    <polygon points="256,220 356,160 256,105 156,160" fill="#091E2A" stroke="url(#cyanGrad)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="256" cy="162.5" r="8" fill="#38E8FF"/>
  </g>

  <!-- Cyber Spatial Alignment Beacons -->
  <circle cx="256" cy="105" r="4" fill="#00E5FF"/>
  <circle cx="356" cy="160" r="3.5" fill="#00E5FF"/>
  <circle cx="156" cy="160" r="3.5" fill="#00E5FF"/>
  <circle cx="376" cy="245" r="3.5" fill="#FF2E93"/>
  <circle cx="136" cy="245" r="3.5" fill="#FF2E93"/>
  <circle cx="390" cy="325" r="3.5" fill="#00FFB2"/>
  <circle cx="122" cy="325" r="3.5" fill="#00FFB2"/>
</svg>
